version: 2

sources:

  - name: sql_server_dbo # name of the source 
    schema: sql_server_dbo # this is the schema our raw data lives in
    database: alumno26_dev_bronze_db # this is the name of our database

    quoting:
      database: false
      schema: false
      identifier: false


    tables:

      - name: addresses
        columns:
          - name: address_id
          - name: zipcode
          - name: country
          - name: address
          - name: state
          - name: _fivetran_deleted
          - name: _fivetran_synced
        config:
          loaded_at_field: _fivetran_synced
      - name: events
        columns:
          - name: event_id
          - name: page_url
          - name: event_type
          - name: user_id
          - name: product_id
          - name: session_id
          - name: created_at
          - name: order_id
          - name: _fivetran_deleted
          - name: _fivetran_synced
        config:
          loaded_at_field: _fivetran_synced
      - name: products
        columns:
          - name: product_id
          - name: price
          - name: name
          - name: inventory
          - name: _fivetran_deleted
          - name: _fivetran_synced
        config:
          loaded_at_field: _fivetran_synced
      - name: orders
        columns:
          - name: order_id
          - name: shipping_service
          - name: shipping_cost
          - name: address_id
          - name: created_at
          - name: promo_id
          - name: estimated_delivery_at
          - name: order_cost
          - name: user_id
          - name: order_total
          - name: delivered_at
          - name: tracking_id
          - name: status
          - name: _fivetran_deleted
          - name: _fivetran_synced
        config:
          loaded_at_field: _fivetran_synced
      - name: order_items
        columns:
          - name: order_id
          - name: product_id
          - name: quantity
          - name: _fivetran_deleted
          - name: _fivetran_synced
        config:
          loaded_at_field: _fivetran_synced
      - name: promos
        description: >
          Data about all promos in demo.
        columns:
          - name: promo_id
            description: >
              MD5 for each unique promo on platform.
            data_tests:
              - not_null
              - unique
          - name: discount
            description: >
              Total discount in absolute value.
            data_tests:
              - not_null
              - positive_values
          - name: status
            description: >
              If the promo is active or inactive.
            data_tests:
              - not_null
          - name: _fivetran_deleted
          - name: _fivetran_synced
            data_tests:
              - not_null

        config:
          loaded_at_field: _fivetran_synced
      - name: users
        columns:
          - name: user_id
          - name: updated_at
          - name: address_id
          - name: last_name
          - name: created_at
          - name: phone_number
          - name: total_orders
          - name: first_name
          - name: email
          - name: _fivetran_deleted
          - name: _fivetran_synced
        config:
          loaded_at_field: _fivetran_synced
    config:
      freshness:
        warn_after: {count: 24, period: hour}
        error_after: {count: 48, period: hour}