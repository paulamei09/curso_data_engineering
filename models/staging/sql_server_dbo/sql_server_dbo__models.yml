version: 2

models:
  - name: sql_server_dbo__products
    config:
      contract:
        enforced: true
    description: >
      Data about all products in demo.
    columns:
      - name: product_id
        data_tests:
          - not_null
        data_type: text
        constraints:
          - type: not_null
        description: >
          UUID for each unique product on platform.
      - name: product_name
        data_type: TEXT
        constraints:
          - type: not_null
        description: >
          Name of the product.
      - name: unit_price_usd
        data_tests:
          - positive_values
        data_type: real
        constraints:
          - type: not_null
        description: >
          Price of the product.
      - name: inventory
        data_tests:
          - positive_values
        data_type: NUMBER
        constraints:
          - type: not_null
        description: >
          Amount of the inventory we have for this product.
      - name: date_load
        data_tests:
          - not_null
        data_type: TIMESTAMP_TZ
        constraints:
          - type: not_null
        description: >
          Date that the data was loaded.

  - name: sql_server_dbo__promos
    config:
      contract:
        enforced: true
    description: >
      Data about all promos in demo.
    columns:
      - name: promo_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_sql_server_dbo__orders')
                field: promo_id
        data_type: varchar
        constraints:
          - type: not_null
        description: >
          MD5 for each unique promo on platform.
      - name: promo_name
        data_tests:
          - not_null
        data_type: varchar
        constraints:
          - type: not_null
        description: >
          Name of the promo.
      - name: discount_dollars
        data_tests:
          - not_null
          - positive_values
        data_type: number
        constraints:
          - type: not_null
        description: >
          Total discount in absolute value.
      - name: is_active
        data_tests:
          - not_null
        data_type: boolean
        constraints:
          - type: not_null
        description: >
          If the discount is active or inactive.
      - name: date_load
        data_tests:
          - not_null
        data_type: TIMESTAMP_TZ
        constraints:
          - type: not_null
        description: >
          Date that the data was loaded.